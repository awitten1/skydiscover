services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: skydiscover
      POSTGRES_PASSWORD: skydiscover
      POSTGRES_DB: skydiscover
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - program_database:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skydiscover -d skydiscover"]
      interval: 2s
      timeout: 3s
      retries: 20
volumes:
  program_database:
